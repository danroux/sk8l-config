apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: sk8l-selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: sk8l-ca-issuer
  namespace: sk8l
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # after the CA certificate (certificates.yaml) is Ready
spec:
  ca:
    secretName: sk8l-ca-root-cert-secret
