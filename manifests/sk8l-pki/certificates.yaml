# Secret names are fixed: the sk8l chart hardcodes them in its `tls-certs` volume.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sk8l-ca-root-cert
  namespace: sk8l
spec:
  isCA: true
  commonName: sk8l-ca
  secretName: sk8l-ca-root-cert-secret
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  issuerRef:
    name: sk8l-selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sk8l-server-cert
  namespace: sk8l
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # after sk8l-ca-issuer
spec:
  secretName: sk8l-server-cert-secret
  commonName: sk8l.sk8l.svc
  duration: 2160h      # 90d
  renewBefore: 360h    # 15d
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
    rotationPolicy: Always
  usages:
    - server auth
    - client auth
  # envoy reaches the API at "sk8l" (chart ConfigMap); with port-forward the
  # browser reaches envoy/nginx at localhost. If you expose sk8l through an
  # ingress/LoadBalancer later, add that hostname here and to
  # configMaps.ui.vite_sk8l_api_url in values/sk8l/values.yaml.
  dnsNames:
    - sk8l
    - sk8l.sk8l
    - sk8l.sk8l.svc
    - sk8l.sk8l.svc.cluster.local
    - sk8l-ui
    - sk8l-ui.sk8l
    - sk8l-ui.sk8l.svc
    - sk8l-ui.sk8l.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: sk8l-ca-issuer
    kind: Issuer
    group: cert-manager.io
