# Secret names match tls.secretName and tls.caSecretName in values/sk8l/values.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sk8l-ca-root-cert
  namespace: sk8l
spec:
  isCA: true
  commonName: sk8l-ca
  secretName: sk8l-ca-root-cert-secret
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  issuerRef:
    name: sk8l-selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sk8l-server-cert
  namespace: sk8l
  annotations:
    argocd.argoproj.io/sync-wave: "2"   # after sk8l-ca-issuer
spec:
  secretName: sk8l-server-cert-secret
  commonName: sk8l.sk8l.svc
  duration: 2160h      # 90d
  renewBefore: 360h    # 15d
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
    rotationPolicy: Always
  usages:
    - server auth
    - client auth
  # Clients (browser via port-forward, Prometheus, gRPC clients) reach sk8l on port 8590.
  # If you expose sk8l through an Ingress/LoadBalancer later, add that hostname here.
  dnsNames:
    - sk8l
    - sk8l.sk8l
    - sk8l.sk8l.svc
    - sk8l.sk8l.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  issuerRef:
    name: sk8l-ca-issuer
    kind: Issuer
    group: cert-manager.io
