apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: sk8l-ca-cert-cm
  annotations:
    argocd.argoproj.io/sync-wave: "3"   # after the CA secret exists
spec:
  sources:
    - useDefaultCAs: true
    - secret:
        name: sk8l-ca-root-cert-secret
        key: tls.crt
  target:
    configMap:
      key: trust-bundle.crt
