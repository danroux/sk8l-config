apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sk8l-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sk8l
  source:
    repoURL: https://github.com/danroux/sk8l-config.git
    targetRevision: master
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
