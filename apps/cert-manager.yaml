apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sk8l
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3      # same version as sk8l-api Makefile/CI
    helm:
      valuesObject:
        installCRDs: true        # renamed to `crds.enabled: true` in v1.15+
        prometheus:
          enabled: false
        webhook:
          timeoutSeconds: 4
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true     # CRDs are too large for client-side apply annotations
