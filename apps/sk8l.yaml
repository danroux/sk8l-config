apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sk8l
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sk8l
  # Multi-source (ArgoCD >= 2.6): chart from the sk8l Helm repo,
  # values from this repo via the `$values` ref.
  sources:
    - repoURL: ghcr.io/danroux/sk8l
      chart: sk8l
      targetRevision: 0.23.0
      helm:
        releaseName: sk8l
        valueFiles:
          - $values/values/sk8l/values.yaml
    - repoURL: https://github.com/danroux/sk8l-config.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sk8l
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
    - group: ""
      kind: ServiceAccount
      name: sk8l
      jsonPointers:
        - /create
        - /secrets
        - /imagePullSecrets

