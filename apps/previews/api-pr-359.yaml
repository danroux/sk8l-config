apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sk8l-api-pr-359
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: sk8l
  sources:
    - repoURL: ghcr.io/danroux/sk8l
      chart: sk8l
      targetRevision: 0.29.0
      helm:
        releaseName: sk8l
        valuesObject:
          namespace:
            create: false
            name: sk8l-api-pr-359
          serviceAccount:
            create: true
            metadata:
              name: sk8l
              namespace: sk8l-api-pr-359
          sk8lApi:
            image: ghcr.io/danroux/sk8l-api
            imageTag: "dev-359"
            imagePullPolicy: Always
          tls:
            enabled: true
            secretName: "sk8l-server-cert-secret"
            caSecretName: "sk8l-ca-root-cert-secret"
          service:
            type: ClusterIP
    - repoURL: https://github.com/danroux/sk8l-config.git
      targetRevision: master
      path: manifests/preview-pki
  destination:
    server: https://kubernetes.default.svc
    namespace: sk8l-api-pr-359
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
  ignoreDifferences:
    - kind: ServiceAccount
      name: sk8l
      jsonPointers:
        - /create
        - /secrets
        - /imagePullSecrets
